name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The vectoriser is Rust compiled to wasm; pkg/ is generated, not
      # committed, so it has to be built before typecheck or build.
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/.wasm-pack
            crates/vtracer-wasm/target
          key: wasm-${{ runner.os }}-${{ hashFiles('crates/vtracer-wasm/**') }}
          restore-keys: wasm-${{ runner.os }}-
      - run: pnpm build:wasm

      # The same gate as `pnpm check`, as discrete steps so a failure points
      # at the stage that broke.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      - run: pnpm build
        env:
          # GitHub Pages serves project sites from /<repo>/.
          BASE_PATH: /${{ github.event.repository.name }}/

      # Pages must already be enabled with "GitHub Actions" as the source.
      # The enablement input cannot do it: creating a Pages site is not
      # permitted to the default workflow token ("Resource not accessible by
      # integration"), so it is a one-off manual step in Settings.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
